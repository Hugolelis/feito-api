name: feito

services:
  db:
    container_name: feito-db
    image: postgres:16
    environment:
      POSTGRES_USER: feito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: feito
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    container_name: feito-mailpit
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata: