[project]
name = "feito-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Hugolelis",email = "hugodelelis05@gmail.com"}
]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.162.4,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "psycopg[binary] (>=3.3.8,<4.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "authlib (>=1.9.5,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "fastapi-mail (>=1.6.8,<2.0.0)",
    "email-validator (>=2.3.0,<3.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "app"}]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.4,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)"
]